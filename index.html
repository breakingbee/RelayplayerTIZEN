<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1920, height=1080"/>
  <title>Relay Player</title>
  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px; height: 1080px;
      background: #0a0a0a; color: #eee;
      font-family: "SamsungOne", "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #ui {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; padding: 40px;
      background: linear-gradient(135deg, #0f0f13 0%, #1a1a2e 100%);
      z-index: 10;
    }
    h1 { font-size: 48px; margin-bottom: 8px; color: #00d4ff; }
    .subtitle { font-size: 22px; color: #888; margin-bottom: 30px; }
    .row { display: flex; gap: 20px; margin-bottom: 25px; }
    input {
      flex: 1; height: 70px; font-size: 26px; padding: 0 20px;
      background: #1c1c24; border: 3px solid #333; color: #fff; border-radius: 10px;
    }
    input:focus { border-color: #00d4ff; outline: none; }
    button {
      height: 70px; padding: 0 36px; font-size: 26px;
      background: #00d4ff; color: #000; border: none; border-radius: 10px;
      font-weight: bold; cursor: pointer;
    }
    button:focus, .focus { outline: 4px solid #fff; }
    #recent {
      flex: 1; overflow-y: auto; background: #121218;
      border-radius: 12px; padding: 15px;
    }
    .item {
      padding: 16px 22px; font-size: 24px; border-bottom: 1px solid #2a2a35;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item:focus, .item.focus { background: #00d4ff; color: #000; }
    #status {
      position: absolute; bottom: 25px; left: 40px; right: 40px;
      font-size: 22px; color: #aaa;
    }
    #player-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: none; background: #000; z-index: 5;
    }
    object { width: 100%; height: 100%; }

    #controls {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      display: none; gap: 24px; z-index: 20;
      background: rgba(0,0,0,0.8); padding: 18px 28px; border-radius: 14px;
      font-size: 24px; color: #fff; align-items: center;
    }
    #controls .btn {
      padding: 12px 22px; background: #222; border-radius: 8px;
      border: 2px solid #444; white-space: nowrap;
    }
    #controls .btn.highlight { border-color: #00d4ff; color: #00d4ff; }
    #controls .hint { color: #888; font-size: 20px; margin-left: 8px; }

    #toast {
      position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.9); color: #fff; padding: 18px 36px;
      border-radius: 12px; font-size: 30px; display: none; z-index: 30;
      border: 2px solid #00d4ff;
    }

    #osd {
      position: absolute; top: 40px; right: 40px; z-index: 25;
      background: rgba(0,0,0,0.75); padding: 14px 22px; border-radius: 10px;
      font-size: 22px; color: #ccc; display: none;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Relay Player</h1>
    <div class="subtitle">Enigma2 / streamrelay HTTP TS player for Samsung Tizen (MU7000+)</div>
    <div class="row">
      <input id="url" type="text" placeholder="http://192.168.1.11:17999/...." value="http://192.168.1.11:17999/11758:H:27500:008D:0002:0085:0" autofocus/>
      <button id="playBtn">PLAY</button>
    </div>
    <div id="recent"></div>
    <div id="status">Ready — paste a streamrelay link and press PLAY (or OK)</div>
  </div>

  <div id="player-container">
    <object id="avplayer" type="application/avplayer"></object>
  </div>

  <div id="controls">
    <div class="btn" id="audioBtn">Audio: —</div>
    <div class="btn" id="subBtn">Subs: Off</div>
    <div class="hint">Red = Audio · Green = Subs · OK = Pause · Back = Stop</div>
  </div>

  <div id="osd"></div>
  <div id="toast"></div>

  <script>
    var av = webapis.avplay;
    var urlInput = document.getElementById('url');
    var playBtn = document.getElementById('playBtn');
    var recentDiv = document.getElementById('recent');
    var statusEl = document.getElementById('status');
    var ui = document.getElementById('ui');
    var playerContainer = document.getElementById('player-container');
    var controls = document.getElementById('controls');
    var audioBtn = document.getElementById('audioBtn');
    var subBtn = document.getElementById('subBtn');
    var toastEl = document.getElementById('toast');
    var osdEl = document.getElementById('osd');

    var recent = JSON.parse(localStorage.getItem('relayRecent') || '[]');
    var focusIndex = -1; // -1 = input, 0 = play, 1+ = recent
    var audioTracks = [];
    var textTracks = [];
    var currentAudioIdx = 0; // position in audioTracks array
    var currentTextIdx = -1; // -1 = off, else position in textTracks
    var isPlaying = false;

    function showToast(msg, ms) {
      ms = ms || 2800;
      toastEl.textContent = msg;
      toastEl.style.display = 'block';
      clearTimeout(showToast._t);
      showToast._t = setTimeout(function () { toastEl.style.display = 'none'; }, ms);
    }

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    function saveRecent(url) {
      recent = recent.filter(function (u) { return u !== url; });
      recent.unshift(url);
      if (recent.length > 25) recent.pop();
      localStorage.setItem('relayRecent', JSON.stringify(recent));
      renderRecent();
    }

    function renderRecent() {
      if (!recent.length) {
        recentDiv.innerHTML = '<div style="padding:20px;color:#555">No recent links yet</div>';
        return;
      }
      recentDiv.innerHTML = recent.map(function (u, i) {
        return '<div class="item" data-idx="' + i + '" tabindex="0">' + u + '</div>';
      }).join('');
    }

    /** Parse extra_info which is often a JSON string on Tizen */
    function parseExtra(extra) {
      if (!extra) return {};
      if (typeof extra === 'object') return extra;
      try {
        return JSON.parse(extra);
      } catch (e) {
        return { raw: String(extra) };
      }
    }

    function trackLabel(track, fallbackNum) {
      var extra = parseExtra(track.extra_info);
      var lang = extra.language || extra.track_lang || extra.lang || track.language || '';
      var codec = extra.fourCC || extra.codec || extra.audio_codec || '';
      var channels = extra.channels || extra.channel || '';
      var parts = [];
      if (lang) parts.push(lang);
      if (codec) parts.push(codec);
      if (channels) parts.push(channels + 'ch');
      if (parts.length) return parts.join(' · ');
      return 'Track ' + (fallbackNum + 1);
    }

    function updateTrackUI() {
      if (audioTracks.length === 0) {
        audioBtn.textContent = 'Audio: —';
      } else {
        var a = audioTracks[currentAudioIdx];
        audioBtn.textContent = 'Audio: ' + trackLabel(a, currentAudioIdx) +
          (audioTracks.length > 1 ? '  (' + (currentAudioIdx + 1) + '/' + audioTracks.length + ')' : '');
      }

      if (currentTextIdx < 0 || textTracks.length === 0) {
        subBtn.textContent = 'Subs: Off';
      } else {
        var t = textTracks[currentTextIdx];
        subBtn.textContent = 'Subs: ' + trackLabel(t, currentTextIdx) +
          '  (' + (currentTextIdx + 1) + '/' + textTracks.length + ')';
      }
    }

    function getTracks() {
      audioTracks = [];
      textTracks = [];
      try {
        var info = av.getTotalTrackInfo();
        if (info && info.length) {
          for (var i = 0; i < info.length; i++) {
            var t = info[i];
            var type = (t.type || '').toUpperCase();
            // IMPORTANT: use t.index (AVPlay track index), NOT array position
            var entry = {
              index: (typeof t.index !== 'undefined') ? t.index : i,
              type: type,
              extra_info: t.extra_info,
              language: t.language
            };
            if (type === 'AUDIO') audioTracks.push(entry);
            else if (type === 'TEXT') textTracks.push(entry);
          }
        }
      } catch (e) {
        console.log('getTotalTrackInfo:', e);
      }

      // Keep selection in range
      if (currentAudioIdx >= audioTracks.length) currentAudioIdx = 0;
      if (currentTextIdx >= textTracks.length) currentTextIdx = -1;

      updateTrackUI();

      if (audioTracks.length || textTracks.length) {
        osdEl.style.display = 'block';
        osdEl.textContent = audioTracks.length + ' audio · ' + textTracks.length + ' subtitle track(s)';
        clearTimeout(getTracks._osd);
        getTracks._osd = setTimeout(function () { osdEl.style.display = 'none'; }, 4000);
      }
    }

    function cycleAudio() {
      if (!isPlaying) return;
      if (audioTracks.length < 2) {
        showToast(audioTracks.length === 0 ? 'No audio tracks detected' : 'Only one audio track');
        return;
      }
      currentAudioIdx = (currentAudioIdx + 1) % audioTracks.length;
      try {
        av.setSelectTrack('AUDIO', audioTracks[currentAudioIdx].index);
        updateTrackUI();
        showToast('Audio → ' + trackLabel(audioTracks[currentAudioIdx], currentAudioIdx));
      } catch (e) {
        console.log(e);
        showToast('Audio switch failed');
      }
    }

    function cycleSubtitle() {
      if (!isPlaying) return;
      if (textTracks.length === 0) {
        showToast('No subtitle tracks');
        return;
      }
      // Off → 0 → 1 → … → Off
      currentTextIdx++;
      if (currentTextIdx >= textTracks.length) currentTextIdx = -1;

      try {
        if (currentTextIdx === -1) {
          // Prefer silent subtitle if available
          try {
            av.setSilentSubtitle(true);
          } catch (e1) {
            // Fallback: some firmwares reject -1; just leave last selected
            try { av.setSelectTrack('TEXT', -1); } catch (e2) {}
          }
          showToast('Subtitles Off');
        } else {
          try { av.setSilentSubtitle(false); } catch (e) {}
          av.setSelectTrack('TEXT', textTracks[currentTextIdx].index);
          showToast('Subs → ' + trackLabel(textTracks[currentTextIdx], currentTextIdx));
        }
        updateTrackUI();
      } catch (e) {
        console.log(e);
        showToast('Subtitle switch failed');
      }
    }

    function play(url) {
      if (!url) return;
      url = url.trim();
      saveRecent(url);
      setStatus('Opening stream…');
      ui.style.display = 'none';
      playerContainer.style.display = 'block';
      controls.style.display = 'flex';
      isPlaying = true;

      audioTracks = [];
      textTracks = [];
      currentAudioIdx = 0;
      currentTextIdx = -1;
      updateTrackUI();

      try {
        // Clean previous session
        try { av.stop(); } catch (e) {}
        try { av.close(); } catch (e) {}

        av.open(url);
        av.setDisplayRect(0, 0, 1920, 1080);

        // Prefer full-screen letterbox if available
        try {
          av.setDisplayMethod('PLAYER_DISPLAY_MODE_FULL_SCREEN');
        } catch (e) {}

        av.setListener({
          onbufferingstart: function () { setStatus('Buffering…'); },
          onbufferingprogress: function (p) { setStatus('Buffering ' + p + '%'); },
          onbufferingcomplete: function () {
            setStatus('Playing');
            setTimeout(getTracks, 600);
          },
          oncurrentplaytime: function () {},
          onerror: function (e) {
            setStatus('Error: ' + e);
            showToast('Playback error: ' + e);
            stop();
          },
          onerrormsg: function (e, msg) {
            setStatus('Error: ' + msg);
            showToast(msg || e);
          },
          onstreamcompleted: function () { stop(); },
          onsubtitlechange: function (duration, text) {
            // Optional: could show burned-in subtitle text here if needed
          }
        });

        av.prepareAsync(
          function () {
            av.play();
            setStatus('Playing');
            // Tracks often appear after a short delay on live TS
            setTimeout(getTracks, 1000);
            setTimeout(getTracks, 3000);
          },
          function (err) {
            setStatus('Prepare failed');
            showToast('Cannot play this stream');
            console.log(err);
            stop();
          }
        );
      } catch (e) {
        setStatus('Exception: ' + (e.message || e));
        showToast('Failed to open stream');
        stop();
      }
    }

    function stop() {
      isPlaying = false;
      try { av.stop(); } catch (e) {}
      try { av.close(); } catch (e) {}
      playerContainer.style.display = 'none';
      controls.style.display = 'none';
      osdEl.style.display = 'none';
      ui.style.display = 'flex';
      urlInput.focus();
      focusIndex = -1;
      setStatus('Stopped');
    }

    function togglePause() {
      try {
        var state = av.getState();
        if (state === 'PLAYING') {
          av.pause();
          showToast('Paused');
          setStatus('Paused');
        } else if (state === 'PAUSED') {
          av.play();
          showToast('Playing');
          setStatus('Playing');
        }
      } catch (e) {}
    }

    // Key handling
    document.addEventListener('keydown', function (e) {
      var key = e.keyCode;

      // ===== Playing state =====
      if (isPlaying) {
        if (key === 10009 || key === 27 || key === 8 || key === 461) { // Back / Return
          e.preventDefault();
          stop();
        } else if (key === 13 || key === 415 || key === 19 || key === 10252) { // OK / PlayPause
          e.preventDefault();
          togglePause();
        } else if (key === 413) { // MediaStop
          e.preventDefault();
          stop();
        } else if (key === 403 || key === 65 || key === 82) { // Red / A / R
          e.preventDefault();
          cycleAudio();
        } else if (key === 404 || key === 66 || key === 71) { // Green / B / G
          e.preventDefault();
          cycleSubtitle();
        } else if (key === 405) { // Yellow – refresh tracks
          e.preventDefault();
          getTracks();
          showToast('Tracks refreshed');
        }
        return;
      }

      // ===== UI navigation =====
      var items = recentDiv.querySelectorAll('.item');
      if ([13, 37, 38, 39, 40].indexOf(key) !== -1) e.preventDefault();

      if (key === 13) { // OK
        if (focusIndex <= 0) play(urlInput.value);
        else if (items[focusIndex - 1]) play(items[focusIndex - 1].textContent);
      } else if (key === 40) { // Down
        focusIndex = Math.min(focusIndex + 1, items.length);
        updateFocus(items);
      } else if (key === 38) { // Up
        focusIndex = Math.max(focusIndex - 1, -1);
        updateFocus(items);
      }
    });

    function updateFocus(items) {
      urlInput.classList.remove('focus');
      playBtn.classList.remove('focus');
      for (var i = 0; i < items.length; i++) items[i].classList.remove('focus');

      if (focusIndex === -1) {
        urlInput.focus();
        urlInput.classList.add('focus');
      } else if (focusIndex === 0) {
        playBtn.focus();
        playBtn.classList.add('focus');
      } else {
        var el = items[focusIndex - 1];
        if (el) {
          el.focus();
          el.classList.add('focus');
          el.scrollIntoView({ block: 'nearest' });
        }
      }
    }

    playBtn.addEventListener('click', function () { play(urlInput.value); });
    recentDiv.addEventListener('click', function (e) {
      if (e.target.classList.contains('item')) play(e.target.textContent);
    });

    // Register media + color keys for Samsung remote
    try {
      tizen.tvinputdevice.registerKey('MediaPlayPause');
      tizen.tvinputdevice.registerKey('MediaPlay');
      tizen.tvinputdevice.registerKey('MediaPause');
      tizen.tvinputdevice.registerKey('MediaStop');
      tizen.tvinputdevice.registerKey('ColorF0Red');
      tizen.tvinputdevice.registerKey('ColorF1Green');
      tizen.tvinputdevice.registerKey('ColorF2Yellow');
      tizen.tvinputdevice.registerKey('ColorF3Blue');
    } catch (e) {}

    renderRecent();
    urlInput.focus();
  </script>
</body>
</html>
