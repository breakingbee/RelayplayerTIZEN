<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1920, height=1080"/>
  <title>Relay Player</title>
  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px; height: 1080px;
      background: #0a0a0a; color: #eee;
      font-family: "SamsungOne", "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #ui {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; padding: 40px;
      background: linear-gradient(135deg, #0f0f13 0%, #1a1a2e 100%);
      z-index: 10;
    }
    h1 { font-size: 48px; margin-bottom: 8px; color: #00d4ff; }
    .subtitle { font-size: 22px; color: #888; margin-bottom: 30px; }
    .row { display: flex; gap: 20px; margin-bottom: 25px; }
    input {
      flex: 1; height: 70px; font-size: 26px; padding: 0 20px;
      background: #1c1c24; border: 3px solid #333; color: #fff; border-radius: 10px;
    }
    input:focus { border-color: #00d4ff; outline: none; }
    button {
      height: 70px; padding: 0 36px; font-size: 26px;
      background: #00d4ff; color: #000; border: none; border-radius: 10px;
      font-weight: bold; cursor: pointer;
    }
    button:focus, .focus { outline: 4px solid #fff; }
    #recent {
      flex: 1; overflow-y: auto; background: #121218;
      border-radius: 12px; padding: 15px;
    }
    .item {
      padding: 16px 22px; font-size: 24px; border-bottom: 1px solid #2a2a35;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item:focus, .item.focus { background: #00d4ff; color: #000; }
    #status {
      position: absolute; bottom: 25px; left: 40px; right: 40px;
      font-size: 22px; color: #aaa;
    }
    #player-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: none; background: #000; z-index: 5;
    }
    object { width: 100%; height: 100%; }

    /* On-screen controls overlay while playing */
    #controls {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      display: none; gap: 30px; z-index: 20;
      background: rgba(0,0,0,0.75); padding: 18px 30px; border-radius: 14px;
      font-size: 24px; color: #fff;
    }
    #controls .btn {
      padding: 12px 24px; background: #222; border-radius: 8px;
      border: 2px solid #444;
    }
    #controls .btn.active { border-color: #00d4ff; color: #00d4ff; }
    #toast {
      position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.85); color: #fff; padding: 16px 30px;
      border-radius: 10px; font-size: 28px; display: none; z-index: 30;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Relay Player</h1>
    <div class="subtitle">Enigma2 / streamrelay HTTP TS player for Samsung Tizen</div>
    <div class="row">
      <input id="url" type="text" placeholder="http://192.168.1.11:17999/...." value="http://192.168.1.11:17999/11758:H:27500:008D:0002:0085:0" autofocus/>
      <button id="playBtn">PLAY</button>
    </div>
    <div id="recent"></div>
    <div id="status">Ready — paste a streamrelay link and press PLAY (or OK)</div>
  </div>

  <div id="player-container">
    <object id="avplayer" type="application/avplayer"></object>
  </div>

  <div id="controls">
    <div class="btn" id="audioBtn">Audio: —</div>
    <div class="btn" id="subBtn">Subs: Off</div>
    <div class="btn">Back = Stop</div>
  </div>

  <div id="toast"></div>

  <script>
    const av = webapis.avplay;
    const urlInput = document.getElementById('url');
    const playBtn = document.getElementById('playBtn');
    const recentDiv = document.getElementById('recent');
    const status = document.getElementById('status');
    const ui = document.getElementById('ui');
    const playerContainer = document.getElementById('player-container');
    const controls = document.getElementById('controls');
    const audioBtn = document.getElementById('audioBtn');
    const subBtn = document.getElementById('subBtn');
    const toastEl = document.getElementById('toast');

    let recent = JSON.parse(localStorage.getItem('relayRecent') || '[]');
    let focusIndex = -1; // -1 = input, 0 = play, 1+ = recent
    let audioTracks = [];
    let textTracks = [];
    let currentAudio = 0;
    let currentText = -1; // -1 = off

    function showToast(msg, ms = 2500) {
      toastEl.textContent = msg;
      toastEl.style.display = 'block';
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => { toastEl.style.display = 'none'; }, ms);
    }

    function saveRecent(url) {
      recent = recent.filter(u => u !== url);
      recent.unshift(url);
      if (recent.length > 20) recent.pop();
      localStorage.setItem('relayRecent', JSON.stringify(recent));
      renderRecent();
    }

    function renderRecent() {
      recentDiv.innerHTML = recent.map((u, i) =>
        `<div class="item" data-idx="${i}" tabindex="0">${u}</div>`
      ).join('') || '<div style="padding:20px;color:#555">No recent links yet</div>';
    }

    function setStatus(msg) {
      status.textContent = msg;
    }

    function updateTrackUI() {
      const aName = audioTracks[currentAudio]
        ? (audioTracks[currentAudio].language || audioTracks[currentAudio].extra_info || ('Track ' + (currentAudio + 1)))
        : '—';
      audioBtn.textContent = 'Audio: ' + aName;

      if (currentText < 0) {
        subBtn.textContent = 'Subs: Off';
      } else {
        const t = textTracks[currentText];
        subBtn.textContent = 'Subs: ' + (t.language || t.extra_info || ('Track ' + (currentText + 1)));
      }
    }

    function getTracks() {
      try {
        const info = av.getTotalTrackInfo();
        audioTracks = [];
        textTracks = [];
        if (info && info.length) {
          info.forEach((t, idx) => {
            const type = (t.type || '').toUpperCase();
            if (type === 'AUDIO') {
              audioTracks.push({ index: idx, language: t.language, extra_info: t.extra_info });
            } else if (type === 'TEXT') {
              textTracks.push({ index: idx, language: t.language, extra_info: t.extra_info });
            }
          });
        }
        // fallback: some firmwares report differently
        if (audioTracks.length === 0) {
          try {
            const streamInfo = av.getStreamInfo();
            // keep silent if empty
          } catch (e) {}
        }
        currentAudio = 0;
        currentText = -1;
        updateTrackUI();
      } catch (e) {
        console.log('getTotalTrackInfo error', e);
      }
    }

    function cycleAudio() {
      if (audioTracks.length < 2) {
        showToast(audioTracks.length === 0 ? 'No audio tracks found' : 'Only one audio track');
        return;
      }
      currentAudio = (currentAudio + 1) % audioTracks.length;
      try {
        av.setSelectTrack('AUDIO', audioTracks[currentAudio].index);
        updateTrackUI();
        showToast('Audio → ' + (audioTracks[currentAudio].language || ('Track ' + (currentAudio + 1))));
      } catch (e) {
        showToast('Audio switch failed');
      }
    }

    function cycleSubtitle() {
      // Off → first → second → … → Off
      if (textTracks.length === 0) {
        showToast('No subtitle tracks');
        return;
      }
      currentText++;
      if (currentText >= textTracks.length) currentText = -1;

      try {
        if (currentText === -1) {
          // turn off – set a non-existing or use setSilentSubtitle if available
          // many firmwares: select index -1 or just leave last and hide
          av.setSelectTrack('TEXT', -1);
          showToast('Subtitles Off');
        } else {
          av.setSelectTrack('TEXT', textTracks[currentText].index);
          showToast('Subs → ' + (textTracks[currentText].language || ('Track ' + (currentText + 1))));
        }
        updateTrackUI();
      } catch (e) {
        // some Tizen versions throw on -1; try alternative
        try {
          if (currentText >= 0) {
            av.setSelectTrack('TEXT', textTracks[currentText].index);
            showToast('Subs → ' + (textTracks[currentText].language || ('Track ' + (currentText + 1))));
          } else {
            showToast('Subtitles Off (limited support)');
          }
          updateTrackUI();
        } catch (e2) {
          showToast('Subtitle switch failed');
        }
      }
    }

    function play(url) {
      if (!url) return;
      saveRecent(url);
      setStatus('Opening stream…');
      ui.style.display = 'none';
      playerContainer.style.display = 'block';
      controls.style.display = 'flex';

      audioTracks = [];
      textTracks = [];
      currentAudio = 0;
      currentText = -1;
      updateTrackUI();

      try {
        av.open(url);
        av.setDisplayRect(0, 0, 1920, 1080);
        av.setListener({
          onbufferingstart: () => setStatus('Buffering…'),
          onbufferingprogress: (p) => setStatus('Buffering ' + p + '%'),
          onbufferingcomplete: () => {
            setStatus('Playing');
            // tracks often become available after buffering
            setTimeout(getTracks, 800);
          },
          oncurrentplaytime: () => {},
          onerror: (e) => {
            setStatus('Error: ' + e);
            showToast('Playback error');
            stop();
          },
          onstreamcompleted: () => stop()
        });
        av.prepareAsync(
          () => {
            av.play();
            setStatus('Playing');
            setTimeout(getTracks, 1200);
          },
          (err) => {
            setStatus('Prepare failed');
            showToast('Cannot play this stream');
            console.log(err);
            stop();
          }
        );
      } catch (e) {
        setStatus('Exception: ' + e.message);
        stop();
      }
    }

    function stop() {
      try { av.stop(); av.close(); } catch (e) {}
      playerContainer.style.display = 'none';
      controls.style.display = 'none';
      ui.style.display = 'flex';
      urlInput.focus();
      focusIndex = -1;
    }

    // Key handling
    document.addEventListener('keydown', (e) => {
      const key = e.keyCode;

      // Playing state
      if (playerContainer.style.display === 'block') {
        if (key === 10009 || key === 27 || key === 8) { // Back / Return
          e.preventDefault();
          stop();
        } else if (key === 13 || key === 415 || key === 19 || key === 10252) { // OK / Play / Pause
          e.preventDefault();
          try {
            const state = av.getState();
            if (state === 'PLAYING') { av.pause(); showToast('Paused'); }
            else if (state === 'PAUSED') { av.play(); showToast('Playing'); }
          } catch (ex) {}
        } else if (key === 403 || key === 65) { // Red / A → Audio
          e.preventDefault();
          cycleAudio();
        } else if (key === 404 || key === 66) { // Green / B → Subtitles
          e.preventDefault();
          cycleSubtitle();
        }
        return;
      }

      // UI navigation
      const items = recentDiv.querySelectorAll('.item');
      if ([13, 37, 38, 39, 40].indexOf(key) !== -1) e.preventDefault();

      if (key === 13) { // OK
        if (focusIndex <= 0) play(urlInput.value.trim());
        else if (items[focusIndex - 1]) play(items[focusIndex - 1].textContent);
      } else if (key === 40) { // Down
        focusIndex = Math.min(focusIndex + 1, items.length);
        updateFocus(items);
      } else if (key === 38) { // Up
        focusIndex = Math.max(focusIndex - 1, -1);
        updateFocus(items);
      }
    });

    function updateFocus(items) {
      urlInput.classList.remove('focus');
      playBtn.classList.remove('focus');
      items.forEach(el => el.classList.remove('focus'));

      if (focusIndex === -1) {
        urlInput.focus();
        urlInput.classList.add('focus');
      } else if (focusIndex === 0) {
        playBtn.focus();
        playBtn.classList.add('focus');
      } else {
        const el = items[focusIndex - 1];
        if (el) {
          el.focus();
          el.classList.add('focus');
          el.scrollIntoView({ block: 'nearest' });
        }
      }
    }

    playBtn.addEventListener('click', () => play(urlInput.value.trim()));
    recentDiv.addEventListener('click', (e) => {
      if (e.target.classList.contains('item')) play(e.target.textContent);
    });

    // Register media + color keys
    try {
      tizen.tvinputdevice.registerKey('MediaPlayPause');
      tizen.tvinputdevice.registerKey('MediaPlay');
      tizen.tvinputdevice.registerKey('MediaPause');
      tizen.tvinputdevice.registerKey('MediaStop');
      tizen.tvinputdevice.registerKey('ColorF0Red');
      tizen.tvinputdevice.registerKey('ColorF1Green');
      tizen.tvinputdevice.registerKey('ColorF2Yellow');
      tizen.tvinputdevice.registerKey('ColorF3Blue');
    } catch (e) {}

    renderRecent();
    urlInput.focus();
  </script>
</body>
</html>
